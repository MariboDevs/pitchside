<svg
  class="pitch"
  [class.pitch--flash]="flash() !== null"
  [style.--flash]="flash()"
  [style.--home]="document().home.club.primaryColour"
  [style.--away]="document().away.club.primaryColour"
  viewBox="-2 -2 109 72"
  role="img"
  [attr.aria-label]="'Pitch: ' + document().home.club.name + ' attack to the right'"
  data-testid="pitch"
>
  <rect class="turf" x="0" y="0" width="105" height="68" />
  <g class="lines">
    <rect x="0" y="0" width="105" height="68" />
    <line x1="52.5" y1="0" x2="52.5" y2="68" />
    <circle cx="52.5" cy="34" r="9.15" />
    <rect x="0" y="13.85" width="16.5" height="40.3" />
    <rect x="88.5" y="13.85" width="16.5" height="40.3" />
    <rect x="0" y="24.85" width="5.5" height="18.3" />
    <rect x="99.5" y="24.85" width="5.5" height="18.3" />
  </g>
  @for (mark of marks(); track $index) {
    <circle
      [class]="mark.home ? 'mark mark--home' : 'mark mark--away'"
      [attr.cx]="mark.x"
      [attr.cy]="mark.y"
      r="1.2"
      [attr.opacity]="mark.opacity"
    />
  }
  @if (ball(); as b) {
    <circle class="ball" [attr.cx]="b.x" [attr.cy]="b.y" r="1.1" />
  }
</svg>
