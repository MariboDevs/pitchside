name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, calibrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Pitchside.slnx

      - name: No vulnerable packages, transitive included
        run: |
          set -o pipefail
          dotnet list Pitchside.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then exit 1; fi

      - name: Build (warnings are errors)
        run: dotnet build Pitchside.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Pitchside.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Calibration report (fails when the engine drifts from the real-league targets)
        run: dotnet run --project src/Pitchside.Cli --no-build --configuration Release -- calibrate --matches 2000 --report artifacts/calibration-report.md

      - name: Evaluation report (scripted crew, local groundedness proxy)
        run: dotnet run --project src/Pitchside.Cli --no-build --configuration Release -- evaluate --match MER-7 --provider local --report artifacts/evaluation-report-MER-7.md

      - name: Sample match is reproducible
        run: |
          dotnet run --project src/Pitchside.Cli --no-build --configuration Release -- simulate --seed 7 --out artifacts/seed-7
          diff artifacts/seed-7/events.jsonl data/samples/seed-7/events.jsonl
          diff artifacts/seed-7/match.json data/samples/seed-7/match.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-and-sample
          path: artifacts/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: No high or critical npm advisories
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Production build
        run: npx ng build

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end (starts the API and the dev server, writes artifacts/screens)
        run: npm run e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            artifacts/screens/
            frontend/test-results/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog over the pushed commits
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          version: 3.96.0
          extra_args: --results=verified,unknown
